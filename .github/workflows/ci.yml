name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-order-platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/appts
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Test order-platform
        run: mvn -q test

  backend-erp-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/appts2
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Test erp-adapter
        run: mvn -q test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Test frontend
        run: npm test -- --watchAll=false --runInBand
      - name: Build frontend
        run: npm run build

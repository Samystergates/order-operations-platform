server.port=${SERVER_PORT:9090}
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
server.ssl.key-store=${SERVER_SSL_KEY_STORE:}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=PKCS12

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/order_platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

app.primary-db.url=${APP_PRIMARY_DB_URL:${spring.datasource.url}}
app.primary-db.username=${APP_PRIMARY_DB_USERNAME:${spring.datasource.username}}
app.primary-db.password=${APP_PRIMARY_DB_PASSWORD:${spring.datasource.password}}
app.primary-db.driver-class-name=${APP_PRIMARY_DB_DRIVER_CLASS_NAME:${spring.datasource.driver-class-name}}

app.feign.erp-adapter-url=${APP_FEIGN_ERP_ADAPTER_URL:http://localhost:8080}
app.frontend-origin=${APP_FRONTEND_ORIGIN:http://localhost:3000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:18000000}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.type=${SPRING_JPA_HIBERNATE_TYPE:info}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_LEVEL_HIBERNATE_BINDER:INFO}

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100

#logging.level.root=INFO
logging.level.org.springframework.web=${LOG_LEVEL_SPRING_WEB:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE_SQL:INFO}
logging.level.org.hibernate.tool.hbm2ddl=${LOG_LEVEL_HIBERNATE_DDL:INFO}
logging.level.org.hibernate.tool.schema=${LOG_LEVEL_HIBERNATE_SCHEMA:INFO}
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=${LOG_LEVEL_HIBERNATE_SQL_EXCEPTION:ERROR}
logging.file.name=${LOG_FILE_NAME:app1-console.log}
logging.file.max-size=100MB
logging.file.max-history=3

logging.level.org.springframework.http.converter.json=${LOG_LEVEL_HTTP_JSON:INFO}
logging.level.com.fasterxml.jackson.databind=${LOG_LEVEL_JACKSON:INFO}

logging.level.com.zaxxer.hikari=${LOG_LEVEL_HIKARI:INFO}
logging.level.org.springframework.jdbc.datasource=${LOG_LEVEL_SPRING_JDBC:INFO}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36}.%M - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36}.%M - %msg%n

spring.jmx.enabled=true
spring.jmx.mbean-domain=com.mycompany

spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:25}
spring.datasource.hikari.connection-timeout=30000

management.endpoints.web.exposure.include=health,metrics
management.endpoint.metrics.enabled=true
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
